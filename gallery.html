    <style>
    .textbox {
        height: auto;
        max-height: 48em;
    }
    details {
        margin-bottom: 0.5rem;
        padding: 0.5rem;
    }

    summary {
        cursor: pointer;
        list-style: none;
        outline: none;
        padding: 0.3rem 0;
        margin: 0;
        display: flex;
        align-items: center;
    }

    summary::-webkit-details-marker {
        display: none;
    }

    summary::before {
        content: "▶ ";
        display: inline-block;
        margin-right: 0.5rem;
        transition: transform 0.2s ease;
    }

    details[open] summary::before {
        transform: rotate(90deg);
    }

    .count-badge {
        font-family: 'PixelOperator';
        font-size: 0.7em;
        background: #397a96;
        color: white;
        border-radius: 1em;
        padding: 0.1em 0.6em;
        margin-left: 0.6em;
    }

    .gallery-item {
        display: none;
        margin-top: 1rem;
    }

    details[open] .gallery-item {
        display: block;
    }

    .img-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 0.6rem;
        padding: 0 0.25rem;
    }

    .img-grid figure {
        margin: 0 auto;
        position: relative;
        aspect-ratio: 1 / 1;
        max-width: 170px;
        width: 100%;
        border: 2px solid #666;
        border-radius: 5px;
        overflow: hidden;
        cursor: pointer;
        background: #9fc6dd;
        transition: border-color 0.15s ease;
    }

    .img-grid figure:hover {
        border-color: #2c4a5c;
    }

    .img-grid img {
        width: 100%;
        height: 100%;
        margin:auto;
        object-fit: cover;
        display: block;
    }

    .sensitive-badge {
        position: absolute;
        top: 4px;
        right: 4px;
        background: #a33d3d;
        color: white;
        font-family: 'PixelOperator';
        font-size: 0.65em;
        padding: 0.1em 0.4em;
        border-radius: 4px;
        z-index: 2;
    }

    .blur-image img {
        filter: blur(14px) !important;
        transform: scale(1.1);
        transition: filter 0.2s ease;
    }

    .blur-image.clear img {
        filter: none !important;
        transform: none;
    }

    /* Lightbox */
    #lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(20, 35, 45, 0.85);
        z-index: 999;
        align-items: center;
        justify-content: center;
    }

    #lightbox.active {
        display: flex;
    }

    .lb-box {
        background: #cceeff;
        border: var(--main-border);
        border-radius: var(--main-radius);
        padding: 1em;
        max-width: 90vw;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .lb-box img {
        max-width: 100%;
        max-height: 65vh;
        border-radius: 8px;
        border: 2px solid #666;
        object-fit: contain;
    }

    .lb-caption {
        margin-top: 0.6em;
        font-family: 'PixelOperator';
        color: #416478;
        text-align: center;
    }

    .lb-controls {
        display: flex;
        gap: 0.6em;
        margin-top: 0.6em;
    }

    .lb-controls button {
        font-family: 'Pixelon';
        font-size: 0.8em;
        color: #4b6779;
        border: none;
        border-bottom: 0.1em solid #77a8b9;
        background: var(--btn-gradient);
        border-radius: 8px;
        padding: 0.5em 1em;
        cursor: pointer;
    }

    .lb-controls button:hover {
        color: #2E4A5C;
        background: linear-gradient(0deg, #9bd0eb 0%, #86bde0 20%, #a5d3f3 100%);
    }
    </style>

  <script>
    // Lightbox
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    const lbCaption = document.getElementById("lb-caption");
    const lbPrev = document.getElementById("lb-prev");
    const lbNext = document.getElementById("lb-next");
    const lbClose = document.getElementById("lb-close");

    let currentGroup = [];
    let currentIndex = 0;

    function openLightbox(figures, index) {
      currentGroup = figures;
      currentIndex = index;
      updateLightbox();
      lightbox.classList.add("active");
    }

    function updateLightbox() {
      const fig = currentGroup[currentIndex];
      const img = fig.querySelector("img");
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lbCaption.textContent = img.alt || "";
    }

    function closeLightbox() {
      lightbox.classList.remove("active");
    }

    document.querySelectorAll(".img-grid").forEach((grid) => {
      const figures = Array.from(grid.querySelectorAll("figure"));
      figures.forEach((fig, i) => {
        fig.addEventListener("click", () => {
          const isBlurred = fig.classList.contains("blur-image") && !fig.classList.contains("clear");
          if (isBlurred) {
            // First click on sensitive content only reveals it, doesn't open lightbox
            fig.classList.add("clear");
            return;
          }
          openLightbox(figures, i);
        });
      });
    });

    lbPrev.addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + currentGroup.length) % currentGroup.length;
      updateLightbox();
    });

    lbNext.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % currentGroup.length;
      updateLightbox();
    });

    lbClose.addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("active")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") lbPrev.click();
      if (e.key === "ArrowRight") lbNext.click();
    });
  </script>
