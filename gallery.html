    <style>
    .textbox {
        height: 28em;
    }
    details {
        margin-bottom: 0.5rem; /* Reduced margin between sections */
        padding: 0.5rem; /* Smaller padding to make it compact */
    }

    summary {
        cursor: pointer;
        list-style: none;
        outline: none;
        padding: 0.3rem 0; /* Adjusted padding for a tighter fit */
        margin: 0; /* Removed margin to reduce space between summaries */
    }

    summary::-webkit-details-marker {
        display: none;
    }

    summary::before {
        content: "▶ ";
        display: inline-block;
        margin-right: 0.5rem;
        transition: transform 0.2s ease;
    }

    details[open] summary::before {
        transform: rotate(90deg);
    }

    .gallery-item {
        display: none; /* Hide gallery items by default */
        margin-top: 1rem;
    }

    details[open] .gallery-item {
        display: block; /* Show gallery items when dropdown is open */
    }

    .gallery-item img {
        width: 50%;
        height: auto;
        border: 2px solid #666;
        border-radius: 5px;
        margin-top: 10px;
    }
    .blur-image {
  filter: blur(10px);
  transition: filter 0.3s ease;
}

.clear {
  filter: none;
}
    </style>
</head>
