name: Update Letterboxd feed

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Letterboxd RSS
        run: python scripts/update_letterboxd.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/letterboxd.json
          if git diff --cached --quiet; then
            echo "No Letterboxd updates."
          else
            git commit -m "Update Letterboxd feed"
            git push
          fi
